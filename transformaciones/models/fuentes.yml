version: 2

sources:
  - name: bronze
    # En DuckDB la fuente es un archivo y el esquema no se usa: manda
    # meta.external_location. En BigQuery si se usa, porque ahi bronze es una
    # tabla de verdad y esto es el dataset donde vive.
    #
    # Configurable para que el CI cargue el fixture en su propio dataset y no
    # sobrescriba el bronze real de 67.299 filas.
    schema: "{{ env_var('SECOP_BRONZE_ESQUEMA', 'bronze') }}"
    description: >
      Capa bronze: el NDJSON crudo aterrizado en Parquet por etl/aterrizar.py,
      fiel al origen. Todas las columnas son texto porque la API entrega JSON
      sin esquema y omite las claves nulas: dejar que el lector infiera haria
      que el tipo de una columna dependiera de que filas le tocaron en el lote.
    meta:
      # Configurable para que el CI pueda correr el pipeline completo
      # contra el fixture de tests/fixtures/ sin tocar la red ni
      # necesitar los 67 MB del universo.
      external_location: "{{ env_var('SECOP_BRONZE', '../data/bronze') }}/{name}.parquet"
    tables:
      - name: contratos
        description: >
          Un contrato de obra e infraestructura por fila, tal como lo devolvio
          la API de Socrata (dataset jbjy-vk9h). El universo son los contratos
          firmados desde 2023-10-05 que cumplen el criterio por tipo o el
          criterio por categoria UNSPSC V1.72. Ver docs/decisiones.md, D1.
        columns:
          - name: id_contrato
            description: Clave natural del contrato en SECOP II.
            data_tests: [not_null, unique]
          - name: _ingestado_en
            description: Hora UTC en que etl/aterrizar.py escribio esta fila.
            data_tests: [not_null]

      - name: red_vial
        description: >
          Un segmento de la red vial nacional por fila, tal como lo devolvio la
          API de Socrata (dataset ie7y-asdn de INVIAS). Estatico: 715 filas.

          El grano NO es el tramo. Hay 715 filas y solo 369 `codigo_tramo`
          distintos, porque los tramos vienen partidos en segmentos. Por eso la
          dimension agrega a nivel de territorial y no intenta una clave por
          tramo.

          Varias columnas llegan codificadas como numero -territorial,
          categoria, superficie, calzada, administrador-. Los diccionarios
          estan en los metadatos del dataset y se aplican en silver: bronze
          guarda lo que el origen entrego.

          No se trae `multiline`, la geometria de cada segmento: no hay mapa en
          el informe y multiplica por veinte el tamano del archivo.
        columns:
          - name: codigo_tramo
            description: Codigo del tramo. NO es unico, ver la descripcion.
            data_tests: [not_null]
          - name: territorial
            description: >
              Regional de INVIAS, codificada. Se traduce con el seed
              territoriales_invias. Los codigos 1 a 25 son departamentos.
          - name: shape__length
            description: Longitud del segmento en metros.
          - name: _ingestado_en
            description: Hora UTC en que etl/aterrizar.py escribio esta fila.
            data_tests: [not_null]
