# Versiones exactas con las que corren los workflows.
#
# requirements.txt lleva rangos (>=) para que el proyecto se pueda clonar y
# correr en cualquier maquina. Este fichero fija las versiones, que es lo que
# necesita una corrida automatica: si una dependencia publica una version
# nueva, el CI no se vuelve rojo de un dia para otro sin que nadie haya tocado
# el codigo, y una corrida de hace un mes se puede reproducir.
#
# **Solo se fijan las dependencias DIRECTAS**, no el arbol completo que daria
# `pip freeze`. El motivo no es pereza: pip freeze en Windows fija
# dbt-core-experimental-parser==2.0.8, que es un wheel que pip compilo aqui y
# que en Linux no existe (PyPI solo publica versiones alfa). El CI fallaba con
# "No matching distribution found". Fijar el arbol entero desde una sola
# plataforma hace el lock inservible en las demas; fijar lo que el proyecto
# eligio y dejar que pip resuelva el resto funciona en las dos.
#
# Se regenera comprobando las versiones instaladas:
#   python -c "import importlib.metadata as m; print(m.version('dbt-duckdb'))"

# --- Ingesta (capa bronze) ---
requests==2.34.2
pandas==3.1.0
pyarrow==26.0.0

# --- Transformacion (silver y gold) ---
duckdb==2.0.0
dbt-duckdb==1.11.1

